AWSTemplateFormatVersion: '2010-09-09'
Description: 'ECS Cluster with Fargate Services, ALB, and S3 to demonstrate mTLS'

Parameters:
  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16
    Description: The CIDR range for the VPC. This should be a valid private (RFC 1918) CIDR range.
  
  PublicSubnet1CIDR: 
    Type: String
    Default: 10.0.0.0/24
    Description: CidrBlock for public subnet 01 within the VPC  
  
  PublicSubnet2CIDR: 
    Type: String
    Default: 10.0.1.0/24
    Description: CidrBlock for public subnet 02 within the VPC  
  
  PublicSubnet3CIDR: 
    Type: String
    Default: 10.0.2.0/24
    Description: CidrBlock for public subnet 03 within the VPC    

  PrivateSubnet1CIDR:
    Type: String
    Default: 10.0.3.0/24
    Description: CidrBlock for private subnet 01 within the VPC  
  
  PrivateSubnet2CIDR: 
    Type: String
    Default: 10.0.4.0/24  
    Description: CidrBlock for private subnet 02 within the VPC  

  PrivateSubnet3CIDR: 
    Type: String
    Default: 10.0.5.0/24  
    Description: CidrBlock for private subnet 03 within the VPC  
 
  CertificateArn:
    Type: String
    Description: ARN of ACM SSL certificate

  # Mutual TLS is enabled by the stack itself, not by a manual listener change, so the
  # listeners cannot drift back to server-side TLS only. The trust store is created from the
  # CA bundle in StorageBucket, which only exists after the first deployment, so deployment
  # happens in two passes:
  #   1. Deploy with this parameter empty. Both services run zero tasks, so nothing is served
  #      before mutual TLS is enforced.
  #   2. Upload the CA bundle to StorageBucket, then update the stack with this parameter set
  #      to its object key (for example acm-trust-store/ca-cert.pem) and the image parameters
  #      set to your images. The trust store is created, both listeners switch to
  #      MutualAuthentication Mode=verify, and the services start.
  TrustStoreCABundleS3Key:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9!_.*()/-]+\.pem$'
    Description: >-
      Object key of the CA certificate bundle (PEM) in the stack's StorageBucket, for example
      acm-trust-store/ca-cert.pem. Leave empty on the first deployment; mutual TLS and the
      services are enabled when this is set.

  ServiceOneImage:
    Type: String
    Default: public.ecr.aws/nginx/nginx:latest
    Description: >-
      Container image for service one. Set it to the image you built and pushed to the service
      one ECR repository, using its commit tag (the repositories use immutable tags).

  ServiceTwoImage:
    Type: String
    Default: public.ecr.aws/nginx/nginx:latest
    Description: >-
      Container image for service two. Set it to the image you built and pushed to the service
      two ECR repository, using its commit tag (the repositories use immutable tags).

  EnableECSExec:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Enable ECS Exec on both services so you can open a shell in a task to test mutual TLS.
      ECS Exec gives read access to the client private key in the container. Set to true only
      while testing, then update the stack back to false.

Conditions:
  EnableMutualTLS: !Not [!Equals [!Ref TrustStoreCABundleS3Key, '']]
  ECSExecEnabled: !Equals [!Ref EnableECSExec, 'true']

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W60
            reason: VPC flow logs not required for this example    
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
      - Key: Name
        Value: !Sub '${AWS::StackName}'
        
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPC
      CidrBlock: !Ref PublicSubnet1CIDR
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [ 0, !GetAZs ]
      Tags:
      - Key: Network
        Value: Public
      - Key: Name
        Value: !Sub ${AWS::StackName}-PublicSubnetA 
          
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPC
      CidrBlock: !Ref PublicSubnet2CIDR
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [ 1, !GetAZs ]
      Tags:
      - Key: Name
        Value: !Sub ${AWS::StackName}-PublicSubnetB
      - Key: Network
        Value: Public

  PublicSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPC
      CidrBlock: !Ref PublicSubnet3CIDR
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [ 2, !GetAZs ]
      Tags:
      - Key: Name
        Value: !Sub ${AWS::StackName}-PublicSubnetC
      - Key: Network
        Value: Public

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPC
      CidrBlock: !Ref PrivateSubnet1CIDR
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [ 0, !GetAZs ]
      Tags:
      - Key: Name
        Value: !Sub ${AWS::StackName}-PrivateSubnetA 
      - Key: Network
        Value: Private
       
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPC
      CidrBlock: !Ref PrivateSubnet2CIDR
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [ 1, !GetAZs ]
      Tags:
      - Key: Name
        Value: !Sub ${AWS::StackName}-PrivateSubnetB 
      - Key: Network
        Value: Private
      
  PrivateSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPC
      CidrBlock: !Ref PrivateSubnet3CIDR
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [ 2, !GetAZs ]
      Tags:
      - Key: Name
        Value: !Sub ${AWS::StackName}-PrivateSubnetC
      - Key: Network
        Value: Private      

  PrivateNatA:
      Type: AWS::EC2::NatGateway
      Properties:
        AllocationId:
            Fn::GetAtt:
            - NatGatewayEIP1
            - AllocationId
        SubnetId:
            Ref: PublicSubnet1
        Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-PrivateNatAGateway

  NatGatewayEIP1:
      DependsOn: AttachGateway
      Type: AWS::EC2::EIP
      Properties:
        Domain: vpc

  PrivateRoute01:
      Type: AWS::EC2::Route
      Properties:
        RouteTableId:
            Ref: PrivateRouteTable01
        DestinationCidrBlock: 0.0.0.0/0
        NatGatewayId:
            Ref: PrivateNatA

  PrivateRouteTable01:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-PrivateRouteTable01

  PrivateNatB:
      Type: AWS::EC2::NatGateway
      Properties:
        AllocationId:
            Fn::GetAtt:
            - NatGatewayEIP2
            - AllocationId
        SubnetId:
            Ref: PublicSubnet2
        Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-PrivateNatBGateway

  NatGatewayEIP2:
      DependsOn: AttachGateway
      Type: AWS::EC2::EIP
      Properties:
        Domain: vpc

  PrivateRouteTable02:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-PrivateRouteTable02

  PrivateRoute02:
      Type: AWS::EC2::Route
      Properties:
        RouteTableId:
            Ref: PrivateRouteTable02
        DestinationCidrBlock: 0.0.0.0/0
        NatGatewayId:
            Ref: PrivateNatB

  PrivateNatC:
      Type: AWS::EC2::NatGateway
      Properties:
        AllocationId:
            Fn::GetAtt:
            - NatGatewayEIP3
            - AllocationId
        SubnetId:
            Ref: PublicSubnet3
        Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-PrivateNatCGateway

  NatGatewayEIP3:
      DependsOn: AttachGateway
      Type: AWS::EC2::EIP
      Properties:
        Domain: vpc

  PrivateRoute03:
      Type: AWS::EC2::Route
      Properties:
        RouteTableId:
            Ref: PrivateRouteTable03
        DestinationCidrBlock: 0.0.0.0/0
        NatGatewayId:
            Ref: PrivateNatC

  PrivateRouteTable03:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-PrivateRouteTable03

  PrivateSubnet01RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable01

  PrivateSubnet02RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable02

  PrivateSubnet03RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet3
      RouteTableId: !Ref PrivateRouteTable03

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
      - Key: Network
        Value: Public
      - Key: Name      
        Value: !Sub ${AWS::StackName}-InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId:
        Ref: VPC
      InternetGatewayId:
        Ref: InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: VPC
      Tags:
      - Key: Network
        Value: Public
      - Key: Name
        Value: !Sub ${AWS::StackName}-PublicRouteTable    

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    # The public subnets host only the NAT gateways; no workloads run there and the ALB is
    # internal. A default route to the internet gateway is required for the NAT gateways to
    # provide outbound-only internet access (image pulls, AWS API calls) to the private subnets.
    Metadata:
      guard:
        SuppressedRules:
          - NO_UNRESTRICTED_ROUTE_TO_IGW
    Properties:
      RouteTableId:
        Ref: PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:
        Ref: InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: PublicSubnet1
      RouteTableId:
        Ref: PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: PublicSubnet2
      RouteTableId:
        Ref: PublicRouteTable

  PublicSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: PublicSubnet3
      RouteTableId:
        Ref: PublicRouteTable        


  # S3 bucket that receives server access logs from the other buckets in this stack.
  # It is the terminal log destination: Amazon S3 does not recommend a bucket logging to itself
  # (it creates an infinite loop of log records) and does not support S3 Object Lock on a
  # server access log destination bucket.
  AccessLogBucket:
    Type: AWS::S3::Bucket
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W35
            reason: "This bucket is the server access log destination for the stack; a bucket must not log to itself."
      guard:
        SuppressedRules:
          - S3_BUCKET_LOGGING_ENABLED
          - S3_BUCKET_DEFAULT_LOCK_ENABLED
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: "This bucket is the server access log destination for the stack; a bucket must not log to itself."
    Properties:
      AccessControl: Private
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  AccessLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3ServerAccessLogDelivery
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: 's3:PutObject'
            Resource: !Sub '${AccessLogBucket.Arn}/s3-access-logs/*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt AccessLogBucket.Arn
              - !Sub '${AccessLogBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false

  # S3 bucket that holds the CA bundle for the ALB trust store and the client certificates
  # consumed by the image build.
  StorageBucket:
    Type: AWS::S3::Bucket
    DependsOn: AccessLogBucketPolicy
    Properties:
      AccessControl: Private
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      ObjectLockEnabled: true
      # Superseded client certificates and private keys are kept as noncurrent versions when
      # they are overwritten or deleted. Expire them after one day so old keys do not linger.
      # (Object Lock is enabled without a default retention, so these versions can expire.)
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldServiceOneKeyVersions
            Status: Enabled
            Prefix: serviceone/
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: ExpireOldServiceTwoKeyVersions
            Status: Enabled
            Prefix: servicetwo/
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogBucket
        LogFilePrefix: s3-access-logs/storage-bucket/

  StorageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StorageBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt StorageBucket.Arn
              - !Sub '${StorageBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false

  # ECS Cluster
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${AWS::StackName}
      CapacityProviders: 
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE_SPOT
          Weight: 1
          Base: 1
      Configuration:
        ExecuteCommandConfiguration:
            Logging: DEFAULT   
      ClusterSettings:
        - Name: containerInsights
          Value: enabled          

  # Security Group for ALB
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: return traffic to user from internet for testing
          - id: W40
            reason: engress open all port for the internet 
    Properties:
      VpcId: !Ref VPC
      GroupDescription: Security group for internal ALB
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8090
          ToPort: 8090
          CidrIp: !Ref VpcCIDR
          Description: Allow traffic from VPC
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref VpcCIDR
          Description: Allow traffic from VPC
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic          


  # Security Group for ECS Tasks
  ECSSecurityGroupServiceOne:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: return traffic to user from internet for testing
          - id: W40
            reason: engress open all port for the internet
          - id: W42
            reason: allow all ingress port within ecs fargate security group    
    Properties:
      VpcId: !Ref VPC    
      GroupDescription: Security group for ECS tasks
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: Allow traffic from internal ALB
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic          

  ECSSecurityGroupServiceTwo:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: return traffic to user from internet for testing
          - id: W40
            reason: engress open all port for the internet
          - id: W42
            reason: allow all ingress port within ecs fargate security group    
    Properties:
      VpcId: !Ref VPC    
      GroupDescription: Security group for ECS tasks
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: Allow traffic from internal ALB
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0 
          Description: Allow all outbound traffic          

  # S3 bucket that receives the ALB access logs and connection logs.
  # Elastic Load Balancing only supports SSE-S3 encryption on this bucket.
  ALBLogBucket:
    Type: AWS::S3::Bucket
    DependsOn: AccessLogBucketPolicy
    Properties:
      AccessControl: Private
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      ObjectLockEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256        
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogBucket
        LogFilePrefix: s3-access-logs/alb-log-bucket/

  ALBLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ALBLogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowELBLogDelivery
            Effect: Allow
            Principal:
              Service: logdelivery.elasticloadbalancing.amazonaws.com
            Action: 's3:PutObject'
            Resource:
              - !Sub '${ALBLogBucket.Arn}/alb-logs/${AWS::StackName}/AWSLogs/${AWS::AccountId}/*'
              - !Sub '${ALBLogBucket.Arn}/alb-connection-logs/${AWS::StackName}/AWSLogs/${AWS::AccountId}/*'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ALBLogBucket.Arn
              - !Sub '${ALBLogBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false



  # Internal Application Load Balancer
  InternalALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    # Elastic Load Balancing validates the bucket policy when access logging is enabled,
    # so the bucket policy must exist before the load balancer is created.
    DependsOn: ALBLogBucketPolicy
    Properties:
      Scheme: internal
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets: 
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
        - !Ref PrivateSubnet3
      Type: application
      LoadBalancerAttributes:
        - Key: access_logs.s3.enabled
          Value: true
        - Key: access_logs.s3.bucket
          Value: !Ref ALBLogBucket
        - Key: access_logs.s3.prefix
          Value: !Sub 'alb-logs/${AWS::StackName}'
        - Key: connection_logs.s3.enabled
          Value: true
        - Key: connection_logs.s3.bucket
          Value: !Ref ALBLogBucket
        - Key: connection_logs.s3.prefix
          Value: !Sub 'alb-connection-logs/${AWS::StackName}'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: true

  # ALB trust store, built from the CA bundle uploaded to StorageBucket. Created only once
  # TrustStoreCABundleS3Key is set (second deployment pass).
  MutualTLSTrustStore:
    Type: AWS::ElasticLoadBalancingV2::TrustStore
    Condition: EnableMutualTLS
    Properties:
      CaCertificatesBundleS3Bucket: !Ref StorageBucket
      CaCertificatesBundleS3Key: !Ref TrustStoreCABundleS3Key

  # ALB Listeners
  # MutualAuthentication Mode=verify makes the ALB reject any client that does not present a
  # valid certificate chaining to the trust store. Expired client certificates are rejected.
  HTTPSListener1:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref InternalALB
      Port: 8080
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup1
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      MutualAuthentication: !If
        - EnableMutualTLS
        - Mode: verify
          TrustStoreArn: !GetAtt MutualTLSTrustStore.TrustStoreArn
          IgnoreClientCertificateExpiry: false
        - !Ref AWS::NoValue

  HTTPSListener2:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref InternalALB
      Port: 8090
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup2
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      MutualAuthentication: !If
        - EnableMutualTLS
        - Mode: verify
          TrustStoreArn: !GetAtt MutualTLSTrustStore.TrustStoreArn
          IgnoreClientCertificateExpiry: false
        - !Ref AWS::NoValue


  # Target Groups
  TargetGroup1:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VPC
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30

  TargetGroup2:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VPC
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30

  # IAM roles
  #
  # The task execution role is used by the ECS agent to pull images and ship container logs.
  # Each service has its own task role, used by the code running inside the container. The
  # task roles grant only what ECS Exec needs: the SSM Session Manager channels, and write
  # access to the service's own log group for the session log. The containers do not call
  # Amazon S3 or AWS KMS at runtime (client certificates are baked into the image at build time).

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Condition:
              ArnLike:
                'aws:SourceArn': !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'

  ServiceOneTaskPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W13
            reason: "ssmmessages channel actions and logs:DescribeLogGroups do not support resource-level permissions."
    Properties:
      Description: Permissions required by ECS Exec for service one
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EcsExecSessionChannels
            Effect: Allow
            Action:
              - 'ssmmessages:CreateControlChannel'
              - 'ssmmessages:CreateDataChannel'
              - 'ssmmessages:OpenControlChannel'
              - 'ssmmessages:OpenDataChannel'
            Resource: '*'
          - Sid: EcsExecSessionLogs
            Effect: Allow
            Action:
              - 'logs:CreateLogStream'
              - 'logs:DescribeLogStreams'
              - 'logs:PutLogEvents'
            Resource: !GetAtt LogGroup1.Arn
          - Sid: EcsExecDescribeLogGroups
            Effect: Allow
            Action: 'logs:DescribeLogGroups'
            Resource: '*'

  ServiceOneTaskRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Condition:
              ArnLike:
                'aws:SourceArn': !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Ref ServiceOneTaskPolicy

  ServiceTwoTaskPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W13
            reason: "ssmmessages channel actions and logs:DescribeLogGroups do not support resource-level permissions."
    Properties:
      Description: Permissions required by ECS Exec for service two
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EcsExecSessionChannels
            Effect: Allow
            Action:
              - 'ssmmessages:CreateControlChannel'
              - 'ssmmessages:CreateDataChannel'
              - 'ssmmessages:OpenControlChannel'
              - 'ssmmessages:OpenDataChannel'
            Resource: '*'
          - Sid: EcsExecSessionLogs
            Effect: Allow
            Action:
              - 'logs:CreateLogStream'
              - 'logs:DescribeLogStreams'
              - 'logs:PutLogEvents'
            Resource: !GetAtt LogGroup2.Arn
          - Sid: EcsExecDescribeLogGroups
            Effect: Allow
            Action: 'logs:DescribeLogGroups'
            Resource: '*'

  ServiceTwoTaskRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Condition:
              ArnLike:
                'aws:SourceArn': !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Ref ServiceTwoTaskPolicy

  # Task Definitions
  TaskDefinition1:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: nginx-task-def1
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ServiceOneTaskRole.Arn
      Cpu: '256'
      Memory: '512'
      ContainerDefinitions:
        - Name: nginx
          Image: !Ref ServiceOneImage
          Essential: true
          LinuxParameters: 
            InitProcessEnabled: true   
          HealthCheck:
              Command:
                  - "CMD-SHELL"
                  - "curl -f http://localhost/ || exit 1"
              Interval: 5
              Retries: 2
              Timeout: 3                    
          PortMappings:
            - ContainerPort: 80
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup1
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: nginx1

  TaskDefinition2:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: nginx-task-def2
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ServiceTwoTaskRole.Arn
      Cpu: '256'
      Memory: '512'
      ContainerDefinitions:
        - Name: nginx
          Image: !Ref ServiceTwoImage
          Essential: true
          LinuxParameters: 
            InitProcessEnabled: true   
          HealthCheck:
              Command:
                  - "CMD-SHELL"
                  - "curl -f http://localhost/ || exit 1"
              Interval: 5
              Retries: 2
              Timeout: 3                    
          PortMappings:
            - ContainerPort: 80
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup2
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: nginx2

  # KMS Key for CloudWatch Logs encryption
  CloudWatchLogsKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for encrypting CloudWatch Logs
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow CloudWatch Logs
            Effect: Allow
            Principal:
              Service: 'logs.amazonaws.com'
            Action:
              - 'kms:Encrypt*'
              - 'kms:Decrypt*'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:Describe*'
            Resource: '*'
            Condition:
              ArnLike:
                'kms:EncryptionContext:aws:logs:arn': !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'

  # KMS Key Alias
  CloudWatchLogsKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}-cloudwatch-logs'
      TargetKeyId: !Ref CloudWatchLogsKMSKey

  # KMS Key for Amazon ECR repository encryption.
  # Amazon ECR uses KMS grants created on behalf of the principal that creates the repository,
  # so the identity deploying this stack needs kms:CreateGrant, kms:RetireGrant and
  # kms:DescribeKey on this key (granted here through the account root statement).
  ECRKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for encrypting Amazon ECR repositories
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'

  ECRKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}-ecr'
      TargetKeyId: !Ref ECRKMSKey

  # CloudWatch Log Groups
  LogGroup1:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/nginx-service-1
      KmsKeyId: !GetAtt CloudWatchLogsKMSKey.Arn
      RetentionInDays: 30

  LogGroup2:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/nginx-service-2
      KmsKeyId: !GetAtt CloudWatchLogsKMSKey.Arn
      RetentionInDays: 30

  # ECS Services
  # DesiredCount stays at 0 until mutual TLS is enabled on the listeners, so the services are
  # never reachable through the ALB without client certificate verification.
  Service1:
    Type: AWS::ECS::Service
    DependsOn: HTTPSListener1
    Properties:
      ServiceName: nginx-service-1
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition1
      EnableExecuteCommand: !If [ECSExecEnabled, true, false]
      DesiredCount: !If [EnableMutualTLS, 1, 0]
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - !Ref ECSSecurityGroupServiceOne
          Subnets: 
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
            - !Ref PrivateSubnet3
      LoadBalancers:
        - TargetGroupArn: !Ref TargetGroup1
          ContainerName: nginx
          ContainerPort: 80

  Service2:
    Type: AWS::ECS::Service
    DependsOn: HTTPSListener2
    Properties:
      ServiceName: nginx-service-2
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition2
      EnableExecuteCommand: !If [ECSExecEnabled, true, false]
      DesiredCount: !If [EnableMutualTLS, 1, 0]
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - !Ref ECSSecurityGroupServiceTwo
          Subnets: 
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
            - !Ref PrivateSubnet3
      LoadBalancers:
        - TargetGroupArn: !Ref TargetGroup2
          ContainerName: nginx
          ContainerPort: 80

  ECRRepositoryServiceOne:
    Type: AWS::ECR::Repository
    Properties:
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !GetAtt ECRKMSKey.Arn

  ECRRepositoryServiceTwo:
    Type: AWS::ECR::Repository
    Properties:
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !GetAtt ECRKMSKey.Arn

Outputs:
  LoadBalancerDNS:
    Description: Internal ALB DNS Name
    Value: !GetAtt InternalALB.DNSName
  BucketName:
    Description: Name of created S3 bucket
    Value: !Ref StorageBucket
  ECRRepositoryServiceOne:
    Description: Name of created ECR repository Service One
    Value: !Ref ECRRepositoryServiceOne
  ECRRepositoryServiceTwo:
    Description: Name of created ECR repository Service Two
    Value: !Ref ECRRepositoryServiceTwo
  Service1:
    Description: Name of created ECS service 1
    Value: !Ref Service1
  Service2:
    Description: Name of created ECS service 2
    Value: !Ref Service2
  TaskDefinition1:
    Description: Name of created ECS task definition 1
    Value: !Ref TaskDefinition1
  TaskDefinition2:
    Description: Name of created ECS task definition 2
    Value: !Ref TaskDefinition2
  ECRRepositoryUri:
    Description: URI of created ECR repository Service One
    Value:
      Fn::Join:
        - ""
        - - !Ref AWS::AccountId
          - ".dkr.ecr."
          - !Ref AWS::Region
          - ".amazonaws.com"  
  ECRRepositoryServiceOneUri:
    Description: URI of created ECR repository Service One
    Value:
      Fn::Join:
        - ""
        - - !Ref AWS::AccountId
          - ".dkr.ecr."
          - !Ref AWS::Region
          - ".amazonaws.com/"
          - !Ref ECRRepositoryServiceOne
  ECRRepositoryServiceTwoUri:
    Description: URI of created ECR repository Service Two
    Value:
      Fn::Join:
        - ""
        - - !Ref AWS::AccountId
          - ".dkr.ecr."
          - !Ref AWS::Region
          - ".amazonaws.com/"
          - !Ref ECRRepositoryServiceTwo
  ClusterName:
    Description: Name of created ECS cluster
    Value: !Ref ECSCluster
  Service1ListenerArn:
    Description: ARN of created ALB listener
    Value: !Ref HTTPSListener1
  Service2ListenerArn:
    Description: ARN of created ALB listener
    Value: !Ref HTTPSListener2
  S3bucket:
    Description: Name of created S3 bucket
    Value: !Ref StorageBucket
  TrustStoreArn:
    Condition: EnableMutualTLS
    Description: ARN of the ALB trust store used for mutual TLS
    Value: !GetAtt MutualTLSTrustStore.TrustStoreArn
